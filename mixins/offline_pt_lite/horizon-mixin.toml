[mod]
id = "offline_pt_lite"
version = "0.1.0-alpha.2"
priority = 100

[compatibility]
horizon_revision = "9d979caa48a3bb58203319b9ea044db58c38e0d8"

[[module]]
id = "pt-ctm"
file = "crates/horizon-client-render/src/lib.rs"
name = "ctm"
source = "assets_ctm.rs"
visibility = "pub"

[[module]]
id = "pt-pbr"
file = "crates/horizon-client-render/src/lib.rs"
name = "pbr"
source = "assets_pbr.rs"
visibility = "pub"

[[module]]
id = "pt-model-choices"
file = "crates/horizon-assets/src/blockstate/choice.rs"
name = "native_pt_assets"
source = "assets_choices.rs"

[[module]]
id = "pt-model-materials"
file = "crates/horizon-client-render/src/models/catalog.rs"
