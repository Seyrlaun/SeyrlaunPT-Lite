source = "assets_catalog.rs"

[[module]]
id = "pt-assets-loader"
file = "crates/horizon-client-render/src/assets.rs"
name = "native_pt_assets"
source = "assets_loader.rs"

[[injection]]
id = "pt-load-assets"
target = "horizon_client_render::assets::Assets::reload"
kind = "HEAD"
cancellable = true
helper = "assets_loader_head.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "assets", ty = "&Assets", value = "self" },
]

[[injection]]
id = "pt-load-assets-server"
target = "horizon_client_render::assets::Assets::reload_for_server"
kind = "HEAD"
cancellable = true
helper = "assets_loader_server_head.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "assets", ty = "&Assets", value = "self" },
]

[[module]]
id = "pt-sprites"
file = "crates/horizon-client-render/src/sprites.rs"
name = "native_pt_assets"
source = "assets_sprites.rs"

[[injection]]
id = "pt-sprite-layout"
target = "horizon_client_render::sprites::Sprites::lay_out"
kind = "HEAD"
cancellable = true
helper = "assets_sprite_layout_head.rs"
bindings = [
  { name = "sprites", ty = "&mut Sprites", value = "&mut *self" },
  { name = "pixels", ty = "bool", value = "pixels" },
]

[[injection]]
id = "pt-sprite-load"
target = "horizon_client_render::sprites::Sprites::load"
kind = "HEAD"
cancellable = true
helper = "assets_sprite_load_head.rs"
bindings = [
  { name = "sprites", ty = "&mut Sprites", value = "&mut *self" },
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "name", ty = "&str", value = "name" },
]

